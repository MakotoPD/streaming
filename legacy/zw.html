    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer;
        let cubes = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x3b82f6, 50, 100);
            pointLight1.position.set(10, 10, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xa855f7, 50, 100);
            pointLight2.position.set(-10, -10, 10);
            scene.add(pointLight2);

            // Grid
            const grid = new THREE.GridHelper(200, 50, 0x444444, 0x222222);
            grid.rotation.x = Math.PI / 2;
            grid.position.z = -20;
            scene.add(grid);

            // Floating Shapes (representing the "pixels" or structural elements)
            const sphereGeom = new THREE.SphereGeometry(0.7, 32, 32);
            const pyramidGeom = new THREE.TetrahedronGeometry(1);

            for (let i = 0; i < 120; i++) {
                const isSphere = Math.random() > 0.5;
                const geometry = isSphere ? sphereGeom : pyramidGeom;
                
                const material = new THREE.MeshStandardMaterial({
                    color: Math.random() > 0.5 ? 0x3b82f6 : 0xa855f7,
                    emissive: Math.random() > 0.5 ? 0x3b82f6 : 0xa855f7,
                    emissiveIntensity: 0.6,
                    metalness: 0.9,
                    roughness: 0.1
                });
                const shape = new THREE.Mesh(geometry, material);
                
                shape.position.x = (Math.random() - 0.5) * 70;
                shape.position.y = (Math.random() - 0.5) * 50;
                shape.position.z = (Math.random() - 0.5) * 30;
                
                shape.rotation.x = Math.random() * Math.PI;
                shape.rotation.y = Math.random() * Math.PI;
                
                const scale = Math.random() * 2 + 0.5;
                shape.scale.set(scale, scale, scale);
                
                shape.userData = {
                    isSphere: isSphere,
                    rotationSpeed: (Math.random() - 0.5) * 0.03,
                    floatSpeed: (Math.random() - 0.5) * 0.015,
                    phase: Math.random() * Math.PI * 2
                };
                
                scene.add(shape);
                cubes.push(shape);
            }

            // Post-processing for Bloom
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, // strength
                0.4, // radius
                0.85 // threshold
            );

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            window.addEventListener('resize', onWindowResize, false);
            animate();

        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;
            const pulse = Math.pow(Math.cos(time * Math.PI), 10);

            cubes.forEach((shape, i) => {
                shape.rotation.x += shape.userData.rotationSpeed;
                shape.rotation.y += shape.userData.rotationSpeed;
                shape.position.y += Math.sin(time + i) * shape.userData.floatSpeed;

                if (shape.userData.isSphere) {
                    shape.material.emissiveIntensity = 0.5 + pulse * 2.5;
                }
            });

            camera.position.x = Math.sin(time * 0.2) * 5;
            camera.position.y = Math.cos(time * 0.2) * 2;
            camera.lookAt(0, 0, 0);

            composer.render();
        }

        init();
    </script>
